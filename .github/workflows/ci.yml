name: CI

on:
  push:
  pull_request:

jobs:
  clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run clean checkout suite without agents
        run: bin/ci-clean-checkout
